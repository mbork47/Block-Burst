<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabarık Blok v2</title>
<style>
  body{margin:0;background:#000;font-family:-apple-system,sans-serif;padding:16px}
  canvas{display:block;border-radius:16px;margin:0 auto}
</style>
</head>
<body>

<canvas id="c1" width="360" height="520"></canvas>

<script>
function hexToRgb(hex){
  hex = hex.replace('#','');
  if (hex.length===3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}
function lighten(hex,amt){
  var c=hexToRgb(hex);
  return 'rgb('+Math.min(255,Math.round(c[0]+(255-c[0])*amt))+','+Math.min(255,Math.round(c[1]+(255-c[1])*amt))+','+Math.min(255,Math.round(c[2]+(255-c[2])*amt))+')';
}
function darken(hex,amt){
  var c=hexToRgb(hex);
  return 'rgb('+Math.round(c[0]*(1-amt))+','+Math.round(c[1]*(1-amt))+','+Math.round(c[2]*(1-amt))+')';
}

// TEMİZ KABARIK BLOK — beyaz leke yok, sadece yumuşak katmanlar
function drawPuffyBlock(ctx, x, y, size, color){
  var gap = 1;
  var bx = x+gap, by = y+gap;
  var bs = size - gap*2;

  // 1. DIŞ KENAR (koyu) — yükseklik/duvar hissi
  ctx.fillStyle = darken(color, 0.38);
  ctx.fillRect(bx, by, bs, bs);

  // 2. İÇ YÜZEY — yumuşak gradient (üst açık, alt koyu)
  var innerGap = bs * 0.1;
  var ix = bx + innerGap;
  var iy = by + innerGap;
  var iw = bs - innerGap*2;
  var ih = bs - innerGap*2;

  var grad = ctx.createLinearGradient(ix, iy, ix, iy+ih);
  grad.addColorStop(0, lighten(color, 0.28));
  grad.addColorStop(0.4, color);
  grad.addColorStop(1, darken(color, 0.12));
  ctx.fillStyle = grad;
  ctx.fillRect(ix, iy, iw, ih);

  // 3. ÜST KENAR IŞIĞI — yumuşak geçiş, keskin çizgi değil
  var topG = ctx.createLinearGradient(ix, iy, ix, iy+ih*0.25);
  topG.addColorStop(0, 'rgba(255,255,255,0.4)');
  topG.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = topG;
  ctx.fillRect(ix, iy, iw, ih*0.25);

  // 4. SOL KENAR IŞIĞI
  var leftG = ctx.createLinearGradient(ix, iy, ix+iw*0.2, iy);
  leftG.addColorStop(0, 'rgba(255,255,255,0.22)');
  leftG.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = leftG;
  ctx.fillRect(ix, iy, iw*0.2, ih);

  // 5. ALT GÖLGE
  var botG = ctx.createLinearGradient(ix, iy+ih*0.75, ix, iy+ih);
  botG.addColorStop(0, 'rgba(0,0,0,0)');
  botG.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = botG;
  ctx.fillRect(ix, iy+ih*0.75, iw, ih*0.25);

  // 6. SAĞ GÖLGE
  var rightG = ctx.createLinearGradient(ix+iw*0.8, iy, ix+iw, iy);
  rightG.addColorStop(0, 'rgba(0,0,0,0)');
  rightG.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = rightG;
  ctx.fillRect(ix+iw*0.8, iy, iw*0.2, ih);
}

function drawGame(){
  var canvas = document.getElementById('c1');
  var ctx = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;

  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0e27');
  bg.addColorStop(1, '#050614');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  var glowGrad = ctx.createRadialGradient(W*0.8, 100, 0, W*0.8, 100, 200);
  glowGrad.addColorStop(0, 'rgba(168,139,250,0.12)');
  glowGrad.addColorStop(1, 'rgba(168,139,250,0)');
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, 0, W, H);

  // HUD
  var pad = 16;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '700 10px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SKOR', pad+2, 22);

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 32px -apple-system, sans-serif';
  ctx.fillText('212', pad+2, 54);

  ctx.fillStyle = '#5fd3c4';
  ctx.font = '800 11px -apple-system, sans-serif';
  ctx.fillText('CLASSIC', pad+2, 72);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '700 10px -apple-system, sans-serif';
  ctx.fillText('REKOR', W - pad - 42, 22);

  ctx.fillStyle = '#ffd166';
  ctx.font = '800 24px -apple-system, sans-serif';
  ctx.fillText('4370', W - pad - 42, 54);

  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(W - pad - 36, 14, 32, 32);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillRect(W - pad - 26, 22, 4, 16);
  ctx.fillRect(W - pad - 18, 22, 4, 16);

  // Board
  var boardPad = 16;
  var boardTop = 105;
  var boardW = W - boardPad*2;
  var N = 8;
  var cell = boardW / N;
  var boardH = cell * N;

  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(boardPad - 6, boardTop - 6, boardW + 12, boardH + 12);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.strokeRect(boardPad - 6, boardTop - 6, boardW + 12, boardH + 12);

  // Boş hücreler
  for (var r=0;r<N;r++){
    for (var c=0;c<N;c++){
      var x = boardPad + c*cell;
      var y = boardTop + r*cell;
      var g = cell*0.05;
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(x+g, y+g, cell-g*2, cell-g*2);
    }
  }

  // Dolu bloklar
  var COLORS = ['#ff4757','#00d4b4','#ffb703','#4ade80','#a855f7','#ff7f2a','#3b82f6','#ec4899'];

  var filled = [
    [0,1],[0,2],[0,5],[0,6],[0,7],
    [1,0],[1,2],[1,3],[1,5],[1,7],
    [2,0],[2,1],[2,3],[2,4],[2,6],[2,7],
    [3,0],[3,2],[3,5],[3,6],[3,7],
    [4,0],[4,1],[4,2],[4,4],[4,5],
    [5,1],[5,3],[5,4],[5,5],[5,6],
    [6,0],[6,2],[6,3],[6,5],[6,7],
    [7,0],[7,1],[7,4],[7,6],[7,7]
  ];

  for (var k=0;k<filled.length;k++){
    var f = filled[k];
    var x = boardPad + f[1]*cell;
    var y = boardTop + f[0]*cell;
    var color = COLORS[k % COLORS.length];
    drawPuffyBlock(ctx, x, y, cell, color);
  }

  // Tray
  var trayTop = boardTop + boardH + 16;
  var trayH = 130;
  var trayW = W - boardPad*2;

  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(boardPad - 6, trayTop - 6, trayW + 12, trayH + 12);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.strokeRect(boardPad - 6, trayTop - 6, trayW + 12, trayH + 12);

  var pc = cell * 0.7;

  drawPuffyBlock(ctx, 35, trayTop + 40, pc, '#ff4757');
  drawPuffyBlock(ctx, 35 + pc, trayTop + 40, pc, '#ff4757');

  drawPuffyBlock(ctx, 130, trayTop + 20, pc, '#00d4b4');
  drawPuffyBlock(ctx, 130, trayTop + 20 + pc, pc, '#00d4b4');
  drawPuffyBlock(ctx, 130 + pc, trayTop + 20 + pc, pc, '#00d4b4');

  drawPuffyBlock(ctx, 260, trayTop + 20, pc, '#a855f7');
  drawPuffyBlock(ctx, 260, trayTop + 20 + pc, pc, '#a855f7');
  drawPuffyBlock(ctx, 260, trayTop + 20 + pc*2, pc, '#a855f7');
}

window.addEventListener('load', drawGame);
</script>

</body>
</html>
