var audioCtx = null;

function wakeAudio(){
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended'){
    try { audioCtx.resume(); } catch(e){}
  }
}

function initAudio(){
  if (!audioCtx){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch(e){ audioCtx = null; }
  }
  if (audioCtx){
    wakeAudio();
    if (audioCtx.state === 'running') audioUnlocked = true;
  }
}

document.addEventListener('visibilitychange', function(){
  if (!document.hidden) wakeAudio();
});
window.addEventListener('focus', wakeAudio);
window.addEventListener('pageshow', wakeAudio);

function layer(freq, dur, type, vol, when, opts){
  opts = opts || {};
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') wakeAudio();
  if (audioCtx.state !== 'running') return;
  try {
    var t0 = audioCtx.currentTime + (when||0);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (opts.freqEnd){
      o.frequency.exponentialRampToValueAtTime(Math.max(1, opts.freqEnd), t0+dur);
    }
    if (opts.detune) o.detune.setValueAtTime(opts.detune, t0);
    var attack = opts.attack || 0.006;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    var node = o;
    if (opts.filter){
      var f = audioCtx.createBiquadFilter();
      f.type = opts.filter;
      f.frequency.value = opts.filterFreq || 2000;
      if (opts.q) f.Q.value = opts.q;
      o.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0+dur+0.02);
  } catch(e){}
}

function startMusic(){
  if (!save.musicOn || !audioCtx || musicTimer) return;
  var step = function(){
    if (!save.musicOn) return;
    if (!audioCtx || audioCtx.state !== 'running') return;
    var n = MUSIC_NOTES[musicStep % MUSIC_NOTES.length];
    layer(n, 0.8, 'sine', 0.018, 0);
    layer(n*2, 0.5, 'triangle', 0.006, 0, {detune: 6});
    if (musicStep % 4 === 0){
      layer(n/2, 1.4, 'sine', 0.02, 0);
    }
    if (musicStep % 2 === 0){
      layer(n*1.5, 0.4, 'sine', 0.008, 0.28);
    }
    musicStep++;
  };
  step();
  musicTimer = setInterval(step, 560);
}
function stopMusic(){ if (musicTimer){ clearInterval(musicTimer); musicTimer=null; } }

function normalizeHex(hex){
  if (typeof hex !== 'string') return '000000';
  hex = hex.replace('#','');
  if (hex.length===3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return hex;
}
function lighten(hex,amt){
  hex = normalizeHex(hex);
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return 'rgb('+Math.min(255,Math.round(r+(255-r)*amt))+','+Math.min(255,Math.round(g+(255-g)*amt))+','+Math.min(255,Math.round(b+(255-b)*amt))+')';
}
function darken(hex,amt){
  hex = normalizeHex(hex);
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return 'rgb('+Math.round(r*(1-amt))+','+Math.round(g*(1-amt))+','+Math.round(b*(1-amt))+')';
}
function hexToRgb(hex){
  hex = normalizeHex(hex);
  return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}
function roundRect(x,y,w,h,r){
  if (!isFinite(x)||!isFinite(y)||!isFinite(w)||!isFinite(h)) return;
  if (r<0) r=0;
  var rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function drawGlassPanel(x,y,w,h,r){
  var th = T();
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.35)';
  ctx.shadowBlur=20;
  ctx.shadowOffsetY=8;
  ctx.fillStyle = th.panel;
  roundRect(x,y,w,h,r);
  ctx.fill();
  ctx.shadowColor='transparent';
  ctx.shadowBlur=0;
  ctx.shadowOffsetY=0;
  ctx.strokeStyle = th.panelBorder;
  ctx.lineWidth = 1;
  roundRect(x,y,w,h,r);
  ctx.stroke();
  ctx.restore();
}

function drawBlock(x,y,size,color,opts){
  if (!isFinite(x)||!isFinite(y)||!isFinite(size)||size<=0.5) return;
  opts = opts||{};
  var gap = Math.max(1, size*0.045);
  var s = size-gap*2;
  if (!isFinite(s)||s<=0) return;
  var rad = s*0.30;
  var bx = x+gap, by = y+gap;

  if (opts.shadow || opts.glow){
    ctx.save();
    if (opts.glow){
      ctx.shadowColor = color;
      ctx.shadowBlur = opts.glow;
    } else {
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = opts.shadow;
      ctx.shadowOffsetY = opts.shadow*0.3;
    }
    ctx.fillStyle = color;
    roundRect(bx, by, s, s, rad);
    ctx.fill();
    ctx.restore();
  }

  var g = ctx.createLinearGradient(bx, by, bx, by+s);
  g.addColorStop(0, lighten(color, 0.30));
  g.addColorStop(0.5, color);
  g.addColorStop(1, darken(color, 0.20));
  ctx.fillStyle = g;
  roundRect(bx, by, s, s, rad);
  ctx.fill();

  var gd = ctx.createLinearGradient(bx, by+s*0.55, bx, by+s);
  gd.addColorStop(0, 'rgba(0,0,0,0)');
  gd.addColorStop(1, 'rgba(0,0,0,0.16)');
  ctx.fillStyle = gd;
  roundRect(bx, by, s, s, rad);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  roundRect(bx+s*0.14, by+s*0.1, s*0.72, s*0.3, s*0.15);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  roundRect(bx+s*0.35, by+s*0.16, s*0.3, s*0.07, s*0.035);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = Math.max(1, s*0.018);
  roundRect(bx+s*0.02, by+s*0.02, s-s*0.04, s-s*0.04, rad*0.95);
  ctx.stroke();
}

function drawButton(b, label, color, textColor, fontSize){
  if (!b) return;
  var rad = Math.min(b.h/2, 18);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(b.x, b.y+4, b.w, b.h, rad);
  ctx.fill();
  var bg = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
  bg.addColorStop(0, lighten(color, 0.18));
  bg.addColorStop(1, color);
  ctx.fillStyle = bg;
  roundRect(b.x, b.y, b.w, b.h, rad);
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';
  roundRect(b.x+3, b.y+2, b.w-6, b.h*0.42, rad*0.7);
  ctx.fill();
  ctx.fillStyle = textColor || '#0a0a14';
  ctx.font = '800 '+Math.round(fontSize || W*0.05)+'px -apple-system, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(label, b.x+b.w/2, b.y+b.h/2+1);
}

function makePiece(){
  var shape = POOL[(Math.random()*POOL.length)|0];
  var maxR=0, maxC=0;
  for (var i=0;i<shape.length;i++){
    if (shape[i][0]>maxR) maxR=shape[i][0];
    if (shape[i][1]>maxC) maxC=shape[i][1];
  }
  return { cells: shape, color: COLORS[(Math.random()*COLORS.length)|0],
    w:maxC+1, h:maxR+1, bornAt:now, drawCell:30, trayX:0, trayY:0 };
}

function newPieces(){
  pieces = [makePiece(), makePiece(), makePiece()];
  layoutTray();
}

function getViewportH(){
  var h = window.innerHeight||600;
  if (window.visualViewport && window.visualViewport.height) h=Math.min(h, window.visualViewport.height);
  if (document.documentElement && document.documentElement.clientHeight) h=Math.min(h, document.documentElement.clientHeight);
  if (!isFinite(h)||h<200) h=600;
  return h;
}

function resize(){
  W = window.innerWidth||360;
  H = getViewportH();
  DPR = Math.min(window.devicePixelRatio||1, 3);
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  hudH = Math.min(130, H*0.17);
  var bottomInset = 16;
  trayH = Math.min(125, H*0.18);
  trayY = H-bottomInset-trayH;

  var availW = W-PAD*2;
  var availH = trayY-hudH-12;
  cell = Math.floor(Math.min(availW/N, availH/N));
  if (!isFinite(cell)||cell<10) cell=Math.max(20,Math.floor(availW/N));
  boardSize = cell*N;
  boardX = (W-boardSize)/2;
  boardY = hudH + Math.max(0, (availH-boardSize)/2);
  LIFT = cell*0.08;
  layoutTray();
}

function layoutTray(){
  if (!pieces) return;
  var slotW = W/3;
  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    var pc = Math.min((slotW-22)/p.w, (trayH-16)/p.h, cell*0.72);
    p.drawCell = (isFinite(pc)&&pc>4) ? pc : 30;
    p.trayX = i*slotW + (slotW-p.w*p.drawCell)/2;
    p.trayY = trayY + (trayH-p.h*p.drawCell)/2;
  }
}

function canPlace(p,row,col){
  if (!p) return false;
  for (var i=0;i<p.cells.length;i++){
    var rr=row+p.cells[i][0];
    var cc=col+p.cells[i][1];
    if (rr<0||rr>=N||cc<0||cc>=N) return false;
    if (grid[rr][cc]!==null) return false;
  }
  return true;
}

function anyMove(){
  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    for (var r=0;r<N;r++) for (var c=0;c<N;c++) if (canPlace(p,r,c)) return true;
  }
  return false;
}

function findLines(){
  var rows=[], cols=[], r, c, full;
  for (r=0;r<N;r++){
    full=true;
    for (c=0;c<N;c++) if (grid[r][c]===null){ full=false; break; }
    if (full) rows.push(r);
  }
  for (c=0;c<N;c++){
    full=true;
    for (r=0;r<N;r++) if (grid[r][c]===null){ full=false; break; }
    if (full) cols.push(c);
  }
  return {rows:rows, cols:cols};
}

function spawnParticles(x,y,size,color){
  var rgb = hexToRgb(color);
  for (var i=0;i<7;i++){
    var ang=Math.random()*Math.PI*2;
    var spd=2+Math.random()*4;
    particles.push({ x:x+size/2, y:y+size/2,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-2.5,
      life:1, decay:0.022+Math.random()*0.02,
      size:size*0.1+Math.random()*size*0.16,
      color: Math.random()<0.5 ? lighten(color,0.4) : 'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')' });
  }
}
function spawnFloater(x,y,text,color,big){ floaters.push({x:x,y:y,text:text,color:color,life:1,decay:0.012,big:!!big}); }

function updateEffects(){
  var i;
  for (i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.vx*=0.98;
    p.life-=p.decay;
    if (p.life<=0) particles.splice(i,1);
  }
  for (i=floaters.length-1;i>=0;i--){
    var f=floaters[i];
    f.y-=1.6; f.life-=f.decay;
    if (f.life<=0) floaters.splice(i,1);
  }
  for (i=vanishing.length-1;i>=0;i--) if (now-vanishing[i].start>vanishing[i].dur) vanishing.splice(i,1);
  for (i=pulses.length-1;i>=0;i--) if (now-pulses[i].start>pulses[i].dur) pulses.splice(i,1);
  for (i=confetti.length-1;i>=0;i--){
    var c=confetti[i];
    c.x+=c.vx; c.y+=c.vy; c.vy+=0.28; c.vx*=0.99;
    c.rot+=c.vr; c.life-=c.decay;
    if (c.life<=0 || c.y>H+40) confetti.splice(i,1);
  }
  if (Math.abs(displayScore-score)>0.5) displayScore += (score-displayScore)*0.2;
  else displayScore = score;
  if (scorePulse > 0) scorePulse *= 0.9; else scorePulse = 0;
  if (boardGlow > 0) boardGlow *= 0.92; else boardGlow = 0;
}

function drawEffects(){
  var i, t, size, off;
  for (i=0;i<vanishing.length;i++){
    var v=vanishing[i];
    t=(now-v.start)/v.dur;
    if (t>=1) continue;
    size=cell*(1-t*0.6); off=(cell-size)/2;
    ctx.globalAlpha=1-t;
    drawBlock(v.x+off, v.y+off, size, v.color, {glow: 20*(1-t)});
  }
  ctx.globalAlpha=1;
  for (i=0;i<pulses.length;i++){
    var pu=pulses[i];
    t=(now-pu.start)/pu.dur;
    if (t>=1) continue;
    var r=cell*0.4+t*cell*1.4;
    ctx.globalAlpha=(1-t)*0.7;
    ctx.strokeStyle=pu.color;
    ctx.lineWidth=4*(1-t);
    ctx.beginPath();
    ctx.arc(pu.x+cell/2, pu.y+cell/2, r, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  for (i=0;i<particles.length;i++){
    var pa=particles[i];
    ctx.globalAlpha=Math.max(0,pa.life);
    ctx.fillStyle=pa.color;
    ctx.beginPath();
    ctx.arc(pa.x, pa.y, pa.size*pa.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  for (i=0;i<floaters.length;i++){
    var fl=floaters[i];
    ctx.globalAlpha=Math.max(0,fl.life);
    var scale = 1 + (1-fl.life)*0.15;
    var fs=Math.round(W*(fl.big?0.075:0.055)*scale);
    ctx.font='900 '+fs+'px -apple-system, sans-serif';
    ctx.lineWidth=5;
    ctx.strokeStyle='rgba(0,0,0,0.5)';
    ctx.strokeText(fl.text, fl.x, fl.y);
    ctx.fillStyle=fl.color;
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha=1;
  for (i=0;i<confetti.length;i++){
    var cf=confetti[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, cf.life);
    ctx.translate(cf.x, cf.y);
    ctx.rotate(cf.rot);
    ctx.fillStyle = cf.color;
    ctx.fillRect(-cf.w/2, -cf.h/2, cf.w, cf.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawTray(){
  drawGlassPanel(PAD, trayY-6, W-PAD*2, trayH+12, 20);
  layoutTray();
  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    if (drag && drag.i===i) continue;
    var dc=p.drawCell;
    if (!isFinite(dc)||dc<=2) continue;
    var age=now-(p.bornAt||0);
    var sc=1, al=1;
    if (age>=0 && age<300){ var t=age/300; sc=0.6+0.4*(1-(1-t)*(1-t)); }
    if (age>=0 && age<220) al=age/220;
    if (!isFinite(sc)||sc<=0) sc=1;
    if (!isFinite(al)||al<=0) continue;
    ctx.globalAlpha=al;
    var pc=dc*sc;
    var cx=p.trayX+p.w*dc/2, cy=p.trayY+p.h*dc/2;
    var ox=cx-p.w*pc/2, oy=cy-p.h*pc/2;
    for (var j=0;j<p.cells.length;j++){
      drawBlock(ox+p.cells[j][1]*pc, oy+p.cells[j][0]*pc, pc, p.color);
    }
    ctx.globalAlpha=1;
  }
}

function drawDrag(){

  var startScale=drag.startScale||0.7;
  var t=Math.min(1, age/60);
  var sc=startScale+(1-startScale)*(1-(1-t)*(1-t));
  var pc=size*sc;
  var ox=cx-p.w*pc/2, oy=cy-p.h*pc/2;
  ctx.globalAlpha=0.98;
  for (var i=0;i<p.cells.length;i++){
    drawBlock(ox+p.cells[i][1]*pc, oy+p.cells[i][0]*pc, pc, p.color, {shadow: 18});

  ctx.globalAlpha=1;
}

  var tg = ctx.createLinearGradient(0,-W*0.08,0,W*0.08);
  tg.addColorStop(0, '#ffd166');
  tg.addColorStop(1, '#ff9f68');
  ctx.fillStyle=tg;
  ctx.font='900 '+Math.round(W*0.17)+'px -apple-system, sans-serif';
  ctx.fillText(String(score), 0, 0);
  ctx.restore();

  if (score >= save.best && score > 0){
    ctx.fillStyle = th.accent2;
    ctx.font='800 '+Math.round(W*0.042)+'px -apple-system, sans-serif';
    ctx.fillText('★ YENİ REKOR ★', W/2, cy+cardH*0.36);
  } else {
    ctx.fillStyle = th.dim;
    ctx.font='600 '+Math.round(W*0.036)+'px -apple-system, sans-serif';
    ctx.fillText('Rekor: '+save.best, W/2, cy+cardH*0.36);
  }

  var bw=cardW*0.78, bh=Math.max(56, W*0.14);
  var bx=cx+(cardW-bw)/2;
  var y=cy+cardH*0.5;

  var b1={x:bx, y:y, w:bw, h:bh};
  drawButton(b1, 'TEKRAR OYNA', th.accent, '#ffffff', W*0.052);
  buttons.play = b1;

  y += bh + 12;

  if (!continueUsed){
    var b2={x:bx, y:y, w:bw, h:bh};
    drawButton(b2, '📺 REKLAM İZLE → DEVAM', '#ff9f68', '#ffffff', W*0.038);
    buttons.continue = b2;
    y += bh + 12;
  }

  var b3={x:bx, y:y, w:bw, h:bh*0.8};
  drawButton(b3, 'ANA MENÜ', '#555555', '#ffffff', W*0.046);
  buttons.toMenu = b3;
}

function drawLevelCompleteOverlay(){
  var th = T();
  ctx.fillStyle='rgba(0,0,0,0.75)';
  ctx.fillRect(0,0,W,H);
  var cardW = W*0.86, cardH = H*0.72;
  var cx = (W-cardW)/2, cy = (H-cardH)/2;
  drawGlassPanel(cx, cy, cardW, cardH, 30);

  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.save();
  ctx.translate(W/2, cy+90);
  var p = 1 + Math.sin(now*0.005)*0.06;
  ctx.scale(p, p);
  ctx.font='900 '+Math.round(W*0.18)+'px -apple-system, sans-serif';
  ctx.fillStyle='#ffd166';
  ctx.fillText('★', 0, 0);
  ctx.restore();

  ctx.fillStyle=th.text;
  ctx.font='900 '+Math.round(W*0.088)+'px -apple-system, sans-serif';
  ctx.fillText('LEVEL '+currentLevel()+' BİTTİ!', W/2, cy+cardH*0.32);

  ctx.fillStyle=th.dim;
  ctx.font='600 '+Math.round(W*0.036)+'px -apple-system, sans-serif';
  ctx.fillText('Skor: '+score, W/2, cy+cardH*0.42);

  ctx.fillStyle=th.accent2;
  ctx.font='700 '+Math.round(W*0.034)+'px -apple-system, sans-serif';
  ctx.fillText('Sonraki hedef: '+levelTarget(save.level+1), W/2, cy+cardH*0.48);

  var bw=cardW*0.75, bh=Math.max(56, W*0.14);
  var bx=cx+(cardW-bw)/2;
  var b1={x:bx, y:cy+cardH*0.58, w:bw, h:bh};
  drawButton(b1, 'SONRAKİ LEVEL', th.accent, '#ffffff', W*0.05);
  buttons.nextLevel = b1;

  var b2={x:bx, y:cy+cardH*0.58+bh+12, w:bw, h:bh};
  drawButton(b2, 'ANA MENÜ', '#555555', '#ffffff', W*0.05);
  buttons.toMenu = b2;
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if (STATE==='menu'){ drawMenu(); return; }
  if (STATE==='howto'){ drawHowTo(); return; }
  if (STATE==='settings'){ drawSettings(); return; }

  drawBackground();

  if (shake > 0.3){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= 0.85;
  } else shake = 0;

  buttons = {};
  drawHUD();
  drawBoard();
  drawGhost();
  drawEffects();
  drawTray();
  drawDrag();
  drawToast();

  if (STATE==='paused'){ buttons={}; drawPauseOverlay(); }
  if (STATE==='gameover'){ buttons={}; drawGameOverOverlay(); }
  if (STATE==='levelComplete'){ buttons={}; drawLevelCompleteOverlay(); }
}

function getPos(e){
  var rect = canvas.getBoundingClientRect();
  return { x: e.clientX-rect.left, y: e.clientY-rect.top };
}
function inside(b, x, y){
  return b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h;
}

function handleButton(pos){
  if (STATE==='settings'){
    if (inside(buttons.sound, pos.x, pos.y)){
      save.soundOn = !save.soundOn;
      persist();
      if (save.soundOn){ initAudio(); Sfx.click(); }
      vib(15);
      toast(save.soundOn ? '🔊 Ses açıldı' : '🔇 Ses kapatıldı');
      return true;
    }
    if (inside(buttons.music, pos.x, pos.y)){
      save.musicOn = !save.musicOn;
      persist();
      if (save.musicOn){ initAudio(); startMusic(); }
      else { stopMusic(); }
      vib(15);
      toast(save.musicOn ? '🎵 Müzik açıldı' : '🔇 Müzik kapatıldı');
      return true;
    }
    if (inside(buttons.vibration, pos.x, pos.y)){
      save.vibrationOn = !save.vibrationOn;
      persist();
      if (save.vibrationOn) vib(30);
      toast(save.vibrationOn ? '📳 Titreşim açıldı' : '📴 Titreşim kapatıldı');
      return true;
    }
    if (inside(buttons.theme, pos.x, pos.y)){
      var keys=Object.keys(THEMES);
      var i=keys.indexOf(save.theme);
      save.theme=keys[(i+1)%keys.length];
      persist();
      Sfx.click();
      toast('🎨 Tema: '+T().name);
      return true;
    }
    if (inside(buttons.back, pos.x, pos.y)){
      Sfx.click();
      STATE='menu';
      return true;
    }
  }
  if (STATE==='howto'){
    if (inside(buttons.back, pos.x, pos.y)){
      Sfx.click();
      STATE='menu'; return true;
    }
  }
  if (STATE==='menu'){
    if (inside(buttons.settings, pos.x, pos.y)){ Sfx.click(); STATE='settings'; return true; }
    if (inside(buttons.howto, pos.x, pos.y)){ Sfx.click(); STATE='howto'; return true; }
    if (inside(buttons.play, pos.x, pos.y)){ initAudio(); Sfx.click(); startGame(); return true; }
  }
  if (STATE==='paused'){
    if (inside(buttons.resume, pos.x, pos.y)){ Sfx.click(); STATE='playing'; return true; }
    if (inside(buttons.toMenu, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  if (STATE==='gameover'){
    if (inside(buttons.play, pos.x, pos.y)){ Sfx.click(); startGame(); return true; }
    if (inside(buttons.continue, pos.x, pos.y)){
      Sfx.click();
      toast('Reklam yükleniyor...');
      setTimeout(function(){ handleContinue(); }, 1200);
      return true;
    }
    if (inside(buttons.toMenu, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  if (STATE==='levelComplete'){
    if (inside(buttons.nextLevel, pos.x, pos.y)){
      Sfx.click();
      save.level++;
      persist();
      startGame();
      return true;
    }
    if (inside(buttons.toMenu, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  return false;
}

function updateDrag(pos){
  var p=drag.piece;
  var px=pos.x-drag.grabCol*cell;
  var py=pos.y-drag.grabRow*cell-LIFT;
  drag.px=px;
  drag.py=py;
  drag.col=Math.round((px-boardX)/cell);
  drag.row=Math.round((py-boardY)/cell);
  drag.valid=canPlace(p, drag.row, drag.col);
}

function onDown(e){
  var pos=getPos(e);
  e.preventDefault();
  wakeAudio();
  initAudio();
  if (save.musicOn && !musicTimer) startMusic();

  if (handleButton(pos)) return;
  if (STATE!=='playing') return;

  if (inside(buttons.pause, pos.x, pos.y)){
    Sfx.click();
    vib(10);
    STATE='paused';
    return;
  }

  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    var x0=p.trayX-14, x1=p.trayX+p.w*p.drawCell+14;
    var y0=p.trayY-14, y1=p.trayY+p.h*p.drawCell+14;
    if (pos.x>=x0 && pos.x<=x1 && pos.y>=y0 && pos.y<=y1){
      var gc=(pos.x-p.trayX)/p.drawCell;
      var gr=(pos.y-p.trayY)/p.drawCell;
      gc=Math.max(0, Math.min(p.w, gc));
      gr=Math.max(0, Math.min(p.h, gr));
      drag={ i:i, piece:p, grabCol:gc, grabRow:gr, px:pos.x, py:pos.y,
        col:-99, row:-99, valid:false, pickupAt:now, startScale:p.drawCell/cell };
      updateDrag(pos);
      Sfx.pick();
      vib(8);
      return;
    }
  }
}

function onMove(e){
  if (STATE!=='playing' || !drag) return;
  e.preventDefault();
  updateDrag(getPos(e));
}

function onUp(e){
  if (STATE!=='playing' || !drag) return;
  e.preventDefault();
  var d=drag;
  drag=null;
  if (!d.valid) return;

  var p=d.piece;
  for (var i=0;i<p.cells.length;i++){
    var r=d.row+p.cells[i][0];
    var c=d.col+p.cells[i][1];
    grid[r][c] = p.color;
    addPulse(boardX+c*cell, boardY+r*cell, lighten(p.color,0.4));
  }
  score += p.cells.length;
  scorePulse = 1;
  pieces[d.i] = null;
  Sfx.place();
  vib(10);

  var lines = findLines();
  if (lines.rows.length || lines.cols.length){
    var cleared = {};
    for (var ri=0;ri<lines.rows.length;ri++){
      for (var cc=0;cc<N;cc++) cleared[lines.rows[ri]*N+cc] = true;
    }
    for (var ci=0;ci<lines.cols.length;ci++){
      for (var rr=0;rr<N;rr++) cleared[rr*N+lines.cols[ci]] = true;
    }

    var count = 0;
    for (var key in cleared){
      if (!cleared.hasOwnProperty(key)) continue;
      var idx = parseInt(key,10);
      var r2 = (idx/N)|0;
      var c2 = idx%N;
      if (grid[r2][c2]!==null){
        addVanishing(boardX+c2*cell, boardY+r2*cell, grid[r2][c2]);
        spawnParticles(boardX+c2*cell, boardY+r2*cell, cell, grid[r2][c2]);
        grid[r2][c2]=null;
        count++;
      }
    }

    if (now-lastClear < 1800) combo++; else combo = 1;
    lastClear = now;

    var linesCount = lines.rows.length + lines.cols.length;
    var gain = (count*10 + (linesCount-1)*25) * Math.max(1, combo);
    score += gain;
    scorePulse = 1;
    boardGlow = 1;

    spawnFloater(boardX+boardSize/2, boardY+boardSize/2, '+'+gain, '#ffd166', true);
    if (combo > 1) spawnFloater(boardX+boardSize/2, boardY+boardSize/2+cell*1.8, 'COMBO ×'+combo, '#ff9f68', false);

    shake = Math.min(11, 5+linesCount*2);
    Sfx.clear(linesCount);
    if (combo > 1) Sfx.combo(combo);
    vib(linesCount>1 ? 30 : 20);
  } else {
    if (now-lastClear > 1800) combo = 0;
  }

  if (!pieces[0] && !pieces[1] && !pieces[2]) newPieces();
  if (score > save.best){ save.best = score; persist(); }
  layoutTray();

  if (score >= currentTarget()){
    STATE = 'levelComplete';
    spawnConfetti();
    Sfx.levelUp();
    vib([40,30,40,30,80]);
    return;
  }

  if (!anyMove()){
    STATE = 'gameover';
    save.totalGames++;
    persist();
    Sfx.over();
    vib([100,60,100]);
  }
}

function handleContinue(){
  var cleared = [];
  for (var c=0;c<N;c++){
    var rowsToClear = [0, N-2, N-1];
    for (var ri=0;ri<rowsToClear.length;ri++){
      var r = rowsToClear[ri];
      if (grid[r][c]!==null) cleared.push([r,c]);
    }
  }
  for (var i=0;i<8;i++){
    var rr = Math.floor(Math.random()*N);
    var cc = Math.floor(Math.random()*N);
    if (grid[rr][cc]!==null) cleared.push([rr,cc]);
  }
  for (var j=0;j<cleared.length;j++){
    var r2=cleared[j][0], c2=cleared[j][1];
    addVanishing(boardX+c2*cell, boardY+r2*cell, grid[r2][c2]);
    spawnParticles(boardX+c2*cell, boardY+r2*cell, cell, grid[r2][c2]);
    grid[r2][c2] = null;
  }
  continueUsed = true;
  newPieces();
  STATE = 'playing';
  boardGlow = 1;
  Sfx.levelUp();
  spawnFloater(W/2, H/2, 'DEVAM!', '#5fd3c4', true);
}

canvas.addEventListener('pointerdown', function(e){
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  onDown(e);
}, {passive:false});
canvas.addEventListener('pointermove', onMove, {passive:false});
canvas.addEventListener('pointerup', onUp, {passive:false});
canvas.addEventListener('pointercancel', onUp, {passive:false});
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('resize', function(){ setTimeout(resize, 50); });
window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){ setTimeout(resize, 50); });
}

function startGame(){
  grid = [];
  for (var r=0;r<N;r++){
    var row=[];
    for (var c=0;c<N;c++) row.push(null);
    grid.push(row);
  }
  score=0;
  displayScore=0;
  drag=null;
  particles=[];
  floaters=[];
  vanishing=[];
  pulses=[];
  confetti=[];
  combo=0;
  lastClear=0;
  shake=0;
  scorePulse=0;
  boardGlow=0;
  continueUsed = false;
  now = performance.now();
  newPieces();
  resize();
  STATE = 'playing';
}

function loop(){
  requestAnimationFrame(loop);
  try {
    now = performance.now();
    updateEffects();
    render();
  } catch(err){}
}

resize();
loop();

})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
