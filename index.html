function measureSafeArea(){
  var t = 0, b = 0;
  try {
    if (!document.body) return;
    var td = document.createElement('div');
    td.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none;';
    document.body.appendChild(td);
    var bd = document.createElement('div');
    bd.style.cssText = 'position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;';
    document.body.appendChild(bd);
    var th = td.getBoundingClientRect().height;
    var bh = bd.getBoundingClientRect().height;
    t = (isFinite(th) && th > 0) ? th : 0;
    b = (isFinite(bh) && bh > 0) ? bh : 0;
    document.body.removeChild(td);
    document.body.removeChild(bd);
  } catch(e){ t = 0; b = 0; }
  var isStandalone = false;
  try {
    if (window.navigator.standalone === true) isStandalone = true;
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) isStandalone = true;
  } catch(e){}
  if (t < 20 && isStandalone) t = 44;
  if (t < 20 && !isStandalone && window.innerHeight > 700) t = 20;
  safeTop = isFinite(t) ? Math.round(t) : 0;
  safeBottom = isFinite(b) ? Math.round(b) : 0;
}

function layer(freq, dur, type, vol, when, opts){
  opts = opts || {};
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') wakeAudio();
  if (audioCtx.state !== 'running') return;
  try {
    var t0 = audioCtx.currentTime + (when||0);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (opts.freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, opts.freqEnd), t0+dur);
    if (opts.detune) o.detune.setValueAtTime(opts.detune, t0);
    var attack = opts.attack || 0.006;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    var node = o;
    if (opts.filter){
      var f = audioCtx.createBiquadFilter();
      f.type = opts.filter;
      f.frequency.value = opts.filterFreq || 2000;
      if (opts.q) f.Q.value = opts.q;
      o.connect(f);
      node = f;
    }
    node.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0+dur+0.02);
  } catch(e){}
}

function startMusic(){
  if (!save.musicOn || !audioCtx || musicTimer) return;
  var chords = [[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63]];

  var melodySteps = [0,3,6,10,14];
  var step = function(){
    if (!save.musicOn) return;
    if (!audioCtx || audioCtx.state !== 'running') return;
    var s = musicStep16 % 16;
    var bar = Math.floor(musicStep16 / 16) % 4;
    var chord = chords[bar];
    var bass = basses[bar];
    if (s === 0 || s === 8) layer(60,0.2,'sine',0.08,0,{freqEnd:35,attack:0.003});
    if (s === 4 || s === 12) layer(180,0.08,'triangle',0.035,0,{freqEnd:90});
    if (s % 2 === 0) layer(8000,0.02,'square',0.006,0,{filter:'highpass',filterFreq:6000});
    if (s === 0){
      layer(bass,1.6,'sine',0.06,0,{attack:0.02});
      for (var i=0;i<chord.length;i++) layer(chord[i],2.8,'sine',0.014,0,{attack:0.3});
    }
    if (melodySteps.indexOf(s) >= 0){
      var idx = (musicStep16*7+s*3) % melodyNotes.length;
      layer(melodyNotes[idx],0.6,'triangle',0.035,0,{attack:0.02});
    }
    if (s % 2 === 1){
      var arpNote = chord[(s/2|0) % chord.length] * 2;
      layer(arpNote,0.25,'sine',0.01,0,{attack:0.01});
    }
    musicStep16++;
  };
  step();
  musicTimer = setInterval(step, 156);
}

function normalizeHex(hex){
  if (typeof hex !== 'string') return '000000';
  hex = hex.replace('#','');
  if (hex.length===3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return hex;
}
function lighten(hex,amt){
  hex = normalizeHex(hex);
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return 'rgb('+Math.min(255,Math.round(r+(255-r)*amt))+','+Math.min(255,Math.round(g+(255-g)*amt))+','+Math.min(255,Math.round(b+(255-b)*amt))+')';
}
function darken(hex,amt){
  hex = normalizeHex(hex);
  var r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return 'rgb('+Math.round(r*(1-amt))+','+Math.round(g*(1-amt))+','+Math.round(b*(1-amt))+')';
}
function hexToRgb(hex){
  hex = normalizeHex(hex);
  return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}

function roundRectOn(c, x, y, w, h, r){
  if (!isFinite(x)||!isFinite(y)||!isFinite(w)||!isFinite(h)) return;
  if (r<0) r=0;
  var rr=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+rr,y);
  c.arcTo(x+w,y,x+w,y+h,rr);
  c.arcTo(x+w,y+h,x,y+h,rr);
  c.arcTo(x,y+h,x,y,rr);
  c.arcTo(x,y,x+w,y,rr);
  c.closePath();
}
function roundRect(x,y,w,h,r){ roundRectOn(ctx, x, y, w, h, r); }
function easeOutBack(t){
  var c1 = 1.70158;
  var c3 = c1 + 1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2);
}

function drawPuffyBlockRaw(c, x, y, size, color){
  var gap = Math.max(1, size * 0.015);
  var bx = x+gap, by = y+gap;
  var bs = size - gap*2;
  if (bs <= 0) return;
  c.fillStyle = darken(color, 0.38);
  c.fillRect(bx, by, bs, bs);
  var innerGap = bs * 0.1;
  var ix = bx + innerGap, iy = by + innerGap;
  var iw = bs - innerGap*2, ih = bs - innerGap*2;
  var grad = c.createLinearGradient(ix, iy, ix, iy+ih);
  grad.addColorStop(0, lighten(color, 0.28));
  grad.addColorStop(0.4, color);
  grad.addColorStop(1, darken(color, 0.12));
  c.fillStyle = grad;
  c.fillRect(ix, iy, iw, ih);
  var topG = c.createLinearGradient(ix, iy, ix, iy+ih*0.25);
  topG.addColorStop(0, 'rgba(255,255,255,0.4)');
  topG.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = topG;
  c.fillRect(ix, iy, iw, ih*0.25);
  var leftG = c.createLinearGradient(ix, iy, ix+iw*0.2, iy);
  leftG.addColorStop(0, 'rgba(255,255,255,0.22)');
  leftG.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = leftG;
  c.fillRect(ix, iy, iw*0.2, ih);
  var botG = c.createLinearGradient(ix, iy+ih*0.75, ix, iy+ih);
  botG.addColorStop(0, 'rgba(0,0,0,0)');
  botG.addColorStop(1, 'rgba(0,0,0,0.25)');
  c.fillStyle = botG;
  c.fillRect(ix, iy+ih*0.75, iw, ih*0.25);
  var rightG = c.createLinearGradient(ix+iw*0.8, iy, ix+iw, iy);
  rightG.addColorStop(0, 'rgba(0,0,0,0)');
  rightG.addColorStop(1, 'rgba(0,0,0,0.15)');
  c.fillStyle = rightG;
  c.fillRect(ix+iw*0.8, iy, iw*0.2, ih);
}

function getBlockSprite(color){
  var cached = spriteCache[color];
  if (cached) return cached;
  var c = document.createElement('canvas');
  c.width = SPRITE_SIZE;
  c.height = SPRITE_SIZE;
  var cx = c.getContext('2d');
  try { drawPuffyBlockRaw(cx, 0, 0, SPRITE_SIZE, color); } catch(e){}
  spriteCache[color] = c;
  return c;
}

function drawBlockOn(c, x, y, size, color){
  if (!isFinite(x)||!isFinite(y)||!isFinite(size)||size<=0.5) return;
  var sprite = getBlockSprite(color);
  c.drawImage(sprite, x, y, size, size);
}

// ========== PANEL CACHE ==========
function getPanelCanvas(w, h, r){
  var key = Math.round(w)+'_'+Math.round(h)+'_'+Math.round(r)+'_'+save.theme;
  if (panelCache[key]) return panelCache[key];
  var pad = 4;
  var c = document.createElement('canvas');
  c.width = Math.ceil((w+pad*2)*DPR);
  c.height = Math.ceil((h+pad*2)*DPR);
  var cx = c.getContext('2d');
  cx.setTransform(DPR,0,0,DPR,0,0);
  var th = T();
  roundRectOn(cx, pad, pad, w, h, r);
  cx.fillStyle = th.panel;
  cx.fill();
  roundRectOn(cx, pad, pad, w, h, r);
  cx.strokeStyle = th.panelBorder;
  cx.lineWidth = 1;
  cx.stroke();
  var result = { canvas: c, pad: pad, w: w, h: h };
  panelCache[key] = result;
  return result;
}

function drawGlassPanelOn(c, x, y, w, h, r){
  var p = getPanelCanvas(w, h, r);
  c.drawImage(p.canvas, x - p.pad, y - p.pad, w + p.pad*2, h + p.pad*2);
}
function drawGlassPanel(x,y,w,h,r){ drawGlassPanelOn(ctx, x, y, w, h, r); }

// ========== EMPTY BOARD CACHE ==========
function getEmptyBoardCanvas(){
  var key = cell+'_'+boardSize+'_'+save.theme;
  if (emptyBoardCanvas && emptyBoardKey === key) return emptyBoardCanvas;
  var c = document.createElement('canvas');
  c.width = Math.floor(boardSize*DPR);
  c.height = Math.floor(boardSize*DPR);
  var bx = c.getContext('2d');
  bx.setTransform(DPR,0,0,DPR,0,0);
  var th = T();
  for (var r=0;r<N;r++) for (var cc=0;cc<N;cc++){
    var x=cc*cell, y=r*cell;
    var g=Math.max(1,cell*0.05);
    bx.fillStyle = th.cell;
    bx.fillRect(x+g, y+g, cell-g*2, cell-g*2);
  }
  emptyBoardCanvas = c;
  emptyBoardKey = key;
  return c;
}

var bgDirty = true;
function rebuildBackground(){

  grad.addColorStop(0, th.bg1);
  grad.addColorStop(1, th.bg2);

  for (var i=0;i<glows.length;i++){

}

// ========== BUTON ==========
function drawButtonOn(c, b, label, color, textColor, fontSize){
  if (!b) return;
  var rad = Math.min(b.h/2, 18);
  var pressScale = 1;
  for (var i=0;i<buttonPressEffects.length;i++){
    var pe = buttonPressEffects[i];
    if (pe.id === label && pe.active) pressScale = 0.94;
  }
  var cx = b.x + b.w/2;
  var cy = b.y + b.h/2;
  var bw = b.w * pressScale;
  var bh = b.h * pressScale;
  var bx = cx - bw/2;
  var by = cy - bh/2;
  c.fillStyle = 'rgba(0,0,0,0.35)';
  roundRectOn(c, bx, by+4, bw, bh, rad); c.fill();
  var bg = c.createLinearGradient(bx, by, bx, by+bh);
  bg.addColorStop(0, lighten(color, 0.18));
  bg.addColorStop(1, color);
  c.fillStyle = bg;
  roundRectOn(c, bx, by, bw, bh, rad); c.fill();
  c.fillStyle='rgba(255,255,255,0.22)';
  roundRectOn(c, bx+3, by+2, bw-6, bh*0.42, rad*0.7); c.fill();
  c.fillStyle = textColor || '#0a0a14';
  c.font = '800 '+Math.round(fontSize || W*0.05)+'px -apple-system, sans-serif';
  c.textAlign='center';
  c.textBaseline='middle';
  c.fillText(label, cx, cy+1);
}
function drawButton(b, label, color, textColor, fontSize){ drawButtonOn(ctx, b, label, color, textColor, fontSize); }

// ========== PIECE ==========
function makePiece(){
  var shape = POOL[(Math.random()*POOL.length)|0];
  var maxR=0, maxC=0;
  for (var i=0;i<shape.length;i++){
    if (shape[i][0]>maxR) maxR = shape[i][0];
    if (shape[i][1]>maxC) maxC = shape[i][1];
  }
  return { cells: shape, color: COLORS[(Math.random()*COLORS.length)|0], w:maxC+1, h:maxR+1, bornAt: now - 300, drawCell:30, trayX:0, trayY:0 };
}

function canPlaceAnywhere(p){
  if (!p) return false;
  for (var r=0;r<N;r++) for (var c=0;c<N;c++) if (canPlace(p,r,c)) return true;
  return false;
}

function newPieces(){
  if (save.mode === 'puzzle'){
    var newSet = [];
    for (var i=0;i<3;i++){
      var chosen = null;
      for (var attempt=0; attempt<40; attempt++){
        var candidate = makePiece();
        if (canPlaceAnywhere(candidate)){ chosen = candidate; break; }
      }
      if (!chosen) chosen = makePiece();
      newSet.push(chosen);
    }
    pieces = newSet;
  } else {
    pieces = [makePiece(), makePiece(), makePiece()];
  }
  layoutTray();
}

function getViewportH(){
  var h = window.innerHeight||600;
  if (window.visualViewport && window.visualViewport.height) h = Math.min(h, window.visualViewport.height);
  if (document.documentElement && document.documentElement.clientHeight) h = Math.min(h, document.documentElement.clientHeight);
  if (!isFinite(h)||h<200) h=600;
  return h;
}

var lastResizeW = 0, lastResizeH = 0;
function resize(){
  W = window.innerWidth||360;
  H = getViewportH();
  if (W < 100) W = 360;
  if (H < 200) H = 600;
  if (W === lastResizeW && H === lastResizeH && gameCanvasEl.width > 0) return;
  lastResizeW = W;
  lastResizeH = H;

  measureSafeArea();
  DPR = Math.min(window.devicePixelRatio||1, 3);

  bgCanvasEl.width = Math.floor(W*DPR);
  bgCanvasEl.height = Math.floor(H*DPR);
  bgCanvasEl.style.width = W+'px';
  bgCanvasEl.style.height = H+'px';

  gameCanvasEl.width = Math.floor(W*DPR);
  gameCanvasEl.height = Math.floor(H*DPR);
  gameCanvasEl.style.width = W+'px';
  gameCanvasEl.style.height = H+'px';

  fxCanvasEl.width = Math.floor(W*DPR);
  fxCanvasEl.height = Math.floor(H*DPR);
  fxCanvasEl.style.width = W+'px';
  fxCanvasEl.style.height = H+'px';

  bgCtx.setTransform(DPR,0,0,DPR,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  fxCtx.setTransform(DPR,0,0,DPR,0,0);

  bgDirty = true;
  panelCache = {};
  emptyBoardCanvas = null;
  emptyBoardKey = '';
  spriteCache = {};
  initMenuBlocks();

  var hudBase = Math.min(140, H*0.18);
  hudH = hudBase + safeTop;
  var trayBase = Math.min(125, H*0.18);
  trayH = trayBase;
  trayY = H - safeBottom - 16 - trayH;
  var availW = W-PAD*2;
  var availH = trayY - hudH - 12;
  cell = Math.floor(Math.min(availW/N, availH/N));
  if (!isFinite(cell)||cell<10) cell=Math.max(20,Math.floor(availW/N));
  boardSize = cell*N;
  boardX = (W-boardSize)/2;
  boardY = hudH + Math.max(0, (availH-boardSize)/2);
  LIFT = cell * 0.55;  // <-- Block Blast hissi için büyütüldü
  layoutTray();
}

function layoutTray(){
  if (!pieces) return;
  var trayPadInner = 6;
  var trayLeft = PAD + trayPadInner;
  var trayRight = W - PAD - trayPadInner;
  var trayTop = trayY + trayPadInner;
  var trayBottom = trayY + trayH - trayPadInner;
  var trayInnerW = trayRight - trayLeft;
  var trayInnerH = trayBottom - trayTop;

  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    var slotLeft = trayLeft + i*(trayInnerW/3);
    var slotW2 = trayInnerW/3;
    var pc = Math.min((slotW2-14)/p.w, (trayInnerH-10)/p.h, cell*0.72);
    if (!isFinite(pc) || pc < 4) pc = 4;
    p.drawCell = pc;
    var pieceW = p.w*pc;
    var pieceH = p.h*pc;
    var cx = slotLeft + slotW2/2;
    var cy = trayTop + trayInnerH/2;
    var tx = cx - pieceW/2;
    var ty = cy - pieceH/2;
    if (tx < trayLeft) tx = trayLeft;
    if (tx + pieceW > trayRight) tx = trayRight - pieceW;
    if (ty < trayTop) ty = trayTop;
    if (ty + pieceH > trayBottom) ty = trayBottom - pieceH;
    p.trayX = tx;
    p.trayY = ty;
  }
}

function canPlace(p,row,col){
  if (!p) return false;
  for (var i=0;i<p.cells.length;i++){
    var rr=row+p.cells[i][0];
    var cc=col+p.cells[i][1];
    if (rr<0||rr>=N||cc<0||cc>=N) return false;
    if (grid[rr][cc]!==null) return false;
  }
  return true;
}
function anyMove(){
  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    for (var r=0;r<N;r++) for (var c=0;c<N;c++) if (canPlace(p,r,c)) return true;
  }
  return false;
}
function findLines(){
  var rows=[], cols=[], r, c, full;
  for (r=0;r<N;r++){
    full=true;
    for (c=0;c<N;c++) if (grid[r][c]===null){ full=false; break; }
    if (full) rows.push(r);
  }
  for (c=0;c<N;c++){
    full=true;
    for (r=0;r<N;r++) if (grid[r][c]===null){ full=false; break; }
    if (full) cols.push(c);
  }
  return {rows:rows, cols:cols};
}

// ========== EFFECTS ==========
function spawnParticles(x,y,size,color){
  var rgb = hexToRgb(color);
  var lightColor = lighten(color, 0.4);
  var rgbColor = 'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
  for (var i=0;i<3;i++){
    var ang=Math.random()*Math.PI*2;
    var spd=2+Math.random()*5;
    particles.push({
      x:x+size/2, y:y+size/2,
      vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-2.5,
      life:1, decay:0.025+Math.random()*0.02,
      size:size*0.1+Math.random()*size*0.18,
      color: Math.random()<0.5 ? lightColor : rgbColor
    });
  }
}
function spawnFloater(x,y,text,color,big){ floaters.push({x:x,y:y,text:text,color:color,life:1,decay:0.012,big:!!big}); }
function addVanishing(x,y,color){ vanishing.push({x:x,y:y,color:color,start:now,dur:280}); }
function addPulse(x,y,color){ pulses.push({x:x,y:y,color:color,start:now,dur:380}); }
function spawnFlash(x,y,w,h,color){ flashes.push({x:x,y:y,w:w,h:h,color:color,start:now,dur:220}); }
function spawnConfetti(){
  var colors = COLORS;
  for (var i=0;i<45;i++){
    confetti.push({
      x: W/2 + (Math.random()-0.5)*W*0.8,
      y: H*0.3 + (Math.random()-0.5)*H*0.3,
      vx: (Math.random()-0.5)*10, vy: -3-Math.random()*7,
      rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.5,
      w: 6+Math.random()*8, h: 8+Math.random()*10,
      color: colors[(Math.random()*colors.length)|0],
      life: 1, decay: 0.005+Math.random()*0.004
    });
  }
}

function updateEffects(){
  var i;
  for (i=particles.length-1;i>=0;i--){ var p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.vx*=0.98; p.life-=p.decay; if (p.life<=0) particles.splice(i,1); }
  for (i=floaters.length-1;i>=0;i--){ var f=floaters[i]; f.y-=1.6; f.life-=f.decay; if (f.life<=0) floaters.splice(i,1); }
  for (i=vanishing.length-1;i>=0;i--) if (now-vanishing[i].start>vanishing[i].dur) vanishing.splice(i,1);
  for (i=pulses.length-1;i>=0;i--) if (now-pulses[i].start>pulses[i].dur) pulses.splice(i,1);
  for (i=flashes.length-1;i>=0;i--) if (now-flashes[i].start>flashes[i].dur) flashes.splice(i,1);
  for (i=confetti.length-1;i>=0;i--){ var c=confetti[i]; c.x+=c.vx; c.y+=c.vy; c.vy+=0.28; c.vx*=0.99; c.rot+=c.vr; c.life-=c.decay; if (c.life<=0 || c.y>H+40) confetti.splice(i,1); }
  for (i=buttonPressEffects.length-1;i>=0;i--) if (now-buttonPressEffects[i].start>120) buttonPressEffects.splice(i,1);

  if (displayScore !== score){
    var diff = score - displayScore;
    if (Math.abs(diff) > 0.5) displayScore += diff*0.18;
    else displayScore = score;
  }
  if (scorePulse > 0) scorePulse *= 0.9; else scorePulse = 0;
  if (boardGlow > 0) boardGlow *= 0.92; else boardGlow = 0;
}

// ========== FX LAYER ==========
function renderFX(){
  fxCtx.globalAlpha = 1;

  var doShake = (shake > 0.3);
  if (doShake){
    fxCtx.save();
    fxCtx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  var i, t, size, off;

  for (i=0;i<flashes.length;i++){
    var fl = flashes[i];
    t = (now - fl.start) / fl.dur;
    if (t >= 1) continue;
    fxCtx.globalAlpha = (1-t) * 0.7;
    fxCtx.fillStyle = fl.color;
    fxCtx.fillRect(fl.x, fl.y, fl.w, fl.h);
  }
  fxCtx.globalAlpha = 1;

  for (i=0;i<vanishing.length;i++){
    var v=vanishing[i];
    t=(now-v.start)/v.dur;
    if (t>=1) continue;
    size=cell*(1-t*0.6);
    off=(cell-size)/2;
    fxCtx.globalAlpha=1-t;
    drawBlockOn(fxCtx, v.x+off, v.y+off, size, v.color);
  }
  fxCtx.globalAlpha=1;

  for (i=0;i<pulses.length;i++){
    var pu=pulses[i];
    t=(now-pu.start)/pu.dur;
    if (t>=1) continue;
    var r=cell*0.4+t*cell*1.6;
    fxCtx.globalAlpha=(1-t)*0.8;
    fxCtx.strokeStyle=pu.color;
    fxCtx.lineWidth=4*(1-t);
    fxCtx.beginPath();
    fxCtx.arc(pu.x+cell/2, pu.y+cell/2, r, 0, Math.PI*2);
    fxCtx.stroke();
  }
  fxCtx.globalAlpha=1;

  for (i=0;i<particles.length;i++){
    var pa=particles[i];
    fxCtx.globalAlpha=Math.max(0,pa.life);
    fxCtx.fillStyle=pa.color;
    fxCtx.beginPath();
    fxCtx.arc(pa.x, pa.y, pa.size*pa.life, 0, Math.PI*2);
    fxCtx.fill();
  }
  fxCtx.globalAlpha=1;

  fxCtx.textAlign='center';
  fxCtx.textBaseline='middle';
  for (i=0;i<floaters.length;i++){
    var fl2=floaters[i];
    fxCtx.globalAlpha=Math.max(0,fl2.life);
    var scale2 = 1 + (1-fl2.life)*0.3;
    var rot = (1-fl2.life)*0.08;
    var fs=Math.round(W*(fl2.big?0.08:0.06)*scale2);
    fxCtx.save();
    fxCtx.translate(fl2.x, fl2.y);
    fxCtx.rotate(rot);
    fxCtx.font='900 '+fs+'px -apple-system, sans-serif';
    fxCtx.lineWidth=6;
    fxCtx.strokeStyle='rgba(0,0,0,0.5)';
    fxCtx.strokeText(fl2.text, 0, 0);
    fxCtx.fillStyle=fl2.color;
    fxCtx.fillText(fl2.text, 0, 0);
    fxCtx.restore();
  }
  fxCtx.globalAlpha=1;

  for (i=0;i<confetti.length;i++){
    var cf=confetti[i];
    fxCtx.save();
    fxCtx.globalAlpha=Math.max(0,cf.life);
    fxCtx.translate(cf.x, cf.y);
    fxCtx.rotate(cf.rot);
    fxCtx.fillStyle=cf.color;
    fxCtx.fillRect(-cf.w/2, -cf.h/2, cf.w, cf.h);
    fxCtx.restore();
  }
  fxCtx.globalAlpha=1;

  if (doShake){
    fxCtx.restore();
    shake *= 0.85;
  } else shake = 0;
}

// ========== HUD ==========
function renderHUD(){
  var th = T();
  var labelF = Math.round(W*0.026);
  var numF = Math.round(W*0.072);
  var topY = safeTop;
  var isLevel = (save.mode === 'level');
  var isRush = (save.mode === 'rush');
  var isPuzzle = (save.mode === 'puzzle');

  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.fillStyle=th.dim;
  ctx.font='700 '+labelF+'px -apple-system, sans-serif';
  ctx.fillText('SKOR', PAD+2, topY + 26);

  var scale = 1 + scorePulse*0.08;
  ctx.save();
  ctx.translate(PAD+2, topY + 26 + numF + 2);
  ctx.scale(scale, scale);
  ctx.fillStyle=th.text;
  ctx.font='800 '+numF+'px -apple-system, sans-serif';
  ctx.fillText(String(Math.round(displayScore)), 0, 0);
  ctx.restore();

  if (isRush){
    ctx.textAlign='right';
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.font='700 '+labelF+'px -apple-system, sans-serif';
    ctx.fillText('SURE', W-PAD-42, topY + 26);
    var rushColor = rushSecondsLeft <= 10 ? '#ff6b6b' : '#ff9f68';
    ctx.fillStyle=rushColor;
    ctx.font='800 '+numF+'px -apple-system, sans-serif';
    ctx.fillText(String(rushSecondsLeft), W-PAD-42, topY + 26 + numF + 2);
  } else if (isPuzzle){
    ctx.textAlign='right';
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.font='700 '+labelF+'px -apple-system, sans-serif';
    ctx.fillText('HAMLE', W-PAD-42, topY + 26);
    var puzzleColor = puzzleMoves <= 5 ? '#ff6b6b' : '#ffd166';
    ctx.fillStyle=puzzleColor;
    ctx.font='800 '+Math.round(numF*0.72)+'px -apple-system, sans-serif';
    ctx.fillText(String(puzzleMoves), W-PAD-42, topY + 26 + numF + 2);
  } else {
    ctx.textAlign='right';
    ctx.fillStyle=th.dim;
    ctx.font='700 '+labelF+'px -apple-system, sans-serif';
    ctx.fillText('REKOR', W-PAD-42, topY + 26);
    ctx.fillStyle='#ffd166';
    ctx.font='800 '+Math.round(numF*0.72)+'px -apple-system, sans-serif';
    ctx.fillText(String(currentBest()), W-PAD-42, topY + 26 + numF + 2);
  }

  ctx.textAlign='left';
  ctx.fillStyle = modeColor();
  ctx.font='800 '+Math.round(W*0.028)+'px -apple-system, sans-serif';
  ctx.fillText(modeLabel(), PAD+2, topY + 26 + numF + Math.round(W*0.048));

  if (isLevel){
    var ly = topY + 26 + numF + Math.round(W*0.048);
    var barW = W-PAD*2-100, barH = 8;
    var barX = PAD+2, barY = ly+8;
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(barX, barY, barW, barH, 4); ctx.fill();
    var prog = Math.min(1, score/currentTarget());
    if (prog > 0){
      var bg = ctx.createLinearGradient(barX,0,barX+barW*prog,0);
      bg.addColorStop(0, th.accent); bg.addColorStop(1, th.accent2);
      ctx.fillStyle=bg;
      roundRect(barX, barY, barW*prog, barH, 4); ctx.fill();
    }
    ctx.textAlign='right';
    ctx.fillStyle=th.dim;
    ctx.font='700 '+Math.round(W*0.028)+'px -apple-system, sans-serif';
    ctx.fillText(score+' / '+currentTarget(), W-PAD-42, barY+barH+2);
  } else if (isRush){
    var ly2 = topY + 26 + numF + Math.round(W*0.048);
    var barW2 = W-PAD*2-60, barH2 = 8;
    var barX2 = PAD+2, barY2 = ly2+8;
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(barX2, barY2, barW2, barH2, 4); ctx.fill();
    var timeProg = Math.min(1, rushSecondsLeft / RUSH_DURATION);
    var rushBarColor = rushSecondsLeft <= 10 ? '#ff6b6b' : '#ff9f68';
    ctx.fillStyle=rushBarColor;
    if (timeProg > 0) { roundRect(barX2, barY2, barW2*timeProg, barH2, 4); ctx.fill(); }
  } else if (isPuzzle){
    var ly3 = topY + 26 + numF + Math.round(W*0.048);
    var barW3 = W-PAD*2-60, barH3 = 8;
    var barX3 = PAD+2, barY3 = ly3+8;
    ctx.fillStyle='rgba(255,255,255,0.1)';
    roundRect(barX3, barY3, barW3, barH3, 4); ctx.fill();
    var moveProg = Math.max(0, puzzleMoves / PUZZLE_MOVES);
    var moveColor = puzzleMoves <= 5 ? '#ff6b6b' : '#ffd166';
    ctx.fillStyle=moveColor;
    if (moveProg > 0) { roundRect(barX3, barY3, barW3*moveProg, barH3, 4); ctx.fill(); }
  }

  if (combo > 1){
    var pillW = W*0.34, pillH = 36;
    var pillY = topY + 6;
    var pillScale = 1 + Math.sin(now*0.01)*0.04;
    ctx.save();
    ctx.translate(W/2, pillY + pillH/2);
    ctx.scale(pillScale, pillScale);
    var bg2 = ctx.createLinearGradient(-pillW/2,0,pillW/2,0);
    bg2.addColorStop(0,'#ff9f68');
    bg2.addColorStop(1,'#ffd166');
    ctx.fillStyle='rgba(0,0,0,0.4)';
    roundRect(-pillW/2, -pillH/2+2, pillW, pillH, pillH/2); ctx.fill();
    ctx.fillStyle=bg2;
    roundRect(-pillW/2, -pillH/2, pillW, pillH, pillH/2); ctx.fill();
    ctx.fillStyle='#0a0a14';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='900 '+Math.round(W*0.044)+'px -apple-system, sans-serif';
    ctx.fillText('COMBO x'+combo, 0, 1);
    ctx.restore();
  }

  var pb = {x: W-PAD-34, y: topY + 8, w: 32, h: 32};
  drawGlassPanel(pb.x, pb.y, pb.w, pb.h, 10);
  ctx.fillStyle=th.text;
  ctx.globalAlpha=0.7;
  ctx.fillRect(pb.x+10, pb.y+9, 4, 14);
  ctx.fillRect(pb.x+18, pb.y+9, 4, 14);
  ctx.globalAlpha=1;
  buttons.pause = pb;
}

function renderBoard(){

function renderGhost(){
  if (!drag || !drag.valid) return;
  var p=drag.piece;
  ctx.globalAlpha=0.4;
  for (var i=0;i<p.cells.length;i++){
    var x = boardX+(drag.col+p.cells[i][1])*cell;
    var y = boardY+(drag.row+p.cells[i][0])*cell;
    drawBlockOn(ctx, x, y, cell, p.color);
  }

function renderTray(){
  drawGlassPanel(PAD, trayY-6, W-PAD*2, trayH+12, 20);
  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    if (drag && drag.i===i) continue;
    var dc=p.drawCell;
    if (!isFinite(dc)||dc<=2) continue;
    var pc = dc;
    var cx=p.trayX+p.w*dc/2, cy=p.trayY+p.h*dc/2;
    var ox=cx-p.w*pc/2, oy=cy-p.h*pc/2;
    for (var j=0;j<p.cells.length;j++) drawBlockOn(ctx, ox+p.cells[j][1]*pc, oy+p.cells[j][0]*pc, pc, p.color);
  }
}

// ========== DRAG RENDER - Block Blast juicy hissi ==========
function renderDrag(){
  if (!drag) return;
  var p=drag.piece, size=cell;

  // Pickup animasyonu - küçükten büyür (100ms)
  var age = now - (drag.pickupAt || now);
  var t = Math.min(1, age / 100);
  var ease = 1 - (1-t)*(1-t);
  var baseScale = 0.7 + 0.3 * ease;

  // Valid pozisyonda hafif pulse
  var validPulse = 0;
  if (drag.valid){
    validPulse = 0.04 + Math.sin(now * 0.015) * 0.02;
  }

  var finalScale = baseScale + validPulse;
  var pc = size * finalScale;

  // Merkez etrafında scale
  var cx = drag.px + p.w * size / 2;
  var cy = drag.py + p.h * size / 2;
  var ox = cx - p.w * pc / 2;
  var oy = cy - p.h * pc / 2;

  var sprite = getBlockSprite(p.color);

  ctx.save();
  ctx.globalAlpha = 0.98;

  // Tilt uygula - parmağın hızına göre hafif eğilme
  if (drag.tilt && Math.abs(drag.tilt) > 0.005){
    ctx.translate(cx, cy);
    ctx.rotate(drag.tilt);
    ctx.translate(-cx, -cy);
  }

  for (var i=0;i<p.cells.length;i++){
    ctx.drawImage(sprite, ox+p.cells[i][1]*pc, oy+p.cells[i][0]*pc, pc, pc);
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function renderToast(){
  if (!toastMsg) return;
  var age = (now - toastStart)/1000;
  if (age > 2.5){ toastMsg = null; return; }
  var alpha = age < 0.3 ? age/0.3 : age > 2 ? (2.5-age)/0.5 : 1;
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var w = W*0.7, h = 44;
  var x = (W-w)/2, y = H - safeBottom - 20 - h;
  drawGlassPanel(x, y, w, h, 22);
  ctx.fillStyle = T().text;
  ctx.font = '700 '+Math.round(W*0.036)+'px -apple-system, sans-serif';
  ctx.fillText(toastMsg, W/2, y+h/2+1);
  ctx.globalAlpha = 1;
}

      for (var li=0; li<text.length; li++){
        titleLetters.push({ char: text[li], delay: li*0.08, y: -100 });
      }
    }
    var titleAge = (now - titleStartTime) * 0.001;
    var allDone = true;
    for (var lj=0; lj<titleLetters.length; lj++){
      var letter = titleLetters[lj];
      var elapsed = titleAge - letter.delay - 0.3;
      if (elapsed < 0){ letter.y = -100; allDone = false; }
      else if (elapsed < 0.5){
        var t = elapsed / 0.5;
        letter.y = -100 * (1 - easeOutBack(t));

      } else letter.y = 0;
    }
    if (allDone) titleReady = true;
  }

      var lx = startX + lk * letterSpacing;

    for (var pi=0; pi<buttonPressEffects.length; pi++){

    }
    var cx = x + w/2;

    if (isActive){

  buttons.modeClassic = drawTab(PAD, tabY1, tabW, tabH, 'CLASSIC', 'classic', '#5fd3c4');

    ctx.font='900 '+Math.round(W*0.058)+'px -apple-system, sans-serif';

  } else if (save.mode === 'level'){

  var bw=W*0.68, bh=Math.max(64, W*0.17);

function renderGameOverOverlay(c){
  var th = T();
  c.fillStyle='rgba(0,0,0,0.88)';
  c.fillRect(0,0,W,H);
  var cardW = W*0.86, cardH = Math.min(H*0.8, 580);

  c.font='700 '+Math.round(W*0.034)+'px -apple-system, sans-serif';
  c.fillText('GAME OVER', W/2, cy+45);
  c.save();
  c.translate(W/2, cy+cardH*0.22);
  var sc = 1 + Math.sin(now*0.004)*0.03;
  c.scale(sc, sc);
  var tg = c.createLinearGradient(0,-W*0.08,0,W*0.08);

  c.restore();

    c.fillStyle = th.accent2;
    c.font='800 '+Math.round(W*0.042)+'px -apple-system, sans-serif';
    c.fillText('* NEW RECORD *', W/2, cy+cardH*0.36);
  } else {
    c.fillStyle = th.dim;
    c.font='600 '+Math.round(W*0.036)+'px -apple-system, sans-serif';
    c.fillText('Best: '+bestVal, W/2, cy+cardH*0.36);
  }
  c.fillStyle = 'rgba(255,255,255,0.25)';
  c.font='600 '+Math.round(W*0.028)+'px -apple-system, sans-serif';
  c.fillText(modeLabel(), W/2, cy+cardH*0.42);
  var bw=cardW*0.78, bh=Math.max(56, W*0.14);
  var bx=cx+(cardW-bw)/2;
  var y=cy+cardH*0.52;
  var b1={x:bx, y:y, w:bw, h:bh};
  drawButtonOn(c, b1, 'PLAY AGAIN', th.accent, '#ffffff', W*0.05);
  buttons.play = b1;
  y += bh + 12;
  if (!continueUsed && save.mode !== 'puzzle'){
    var b2={x:bx, y:y, w:bw, h:bh};
    drawButtonOn(c, b2, 'WATCH AD -> CONTINUE', '#ff9f68', '#ffffff', W*0.034);
    buttons.continue = b2;
    y += bh + 12;
  }
  var b3={x:bx, y:y, w:bw, h:bh*0.8};
  drawButtonOn(c, b3, 'MAIN MENU', '#555555', '#ffffff', W*0.046);
  buttons.toMenu = b3;
}

function renderLevelCompleteOverlay(c){
  var th = T();
  c.fillStyle='rgba(0,0,0,0.88)';
  c.fillRect(0,0,W,H);
  var cardW = W*0.86, cardH = Math.min(H*0.72, 560);
  var cx = (W-cardW)/2, cy = (H-cardH)/2;
  drawGlassPanelOn(c, cx, cy, cardW, cardH, 30);
  c.textAlign='center'; c.textBaseline='middle';

  c.save();
  c.translate(W/2, cy+cardH*0.14);
  var p = 1 + Math.sin(now*0.006)*0.1;
  c.scale(p, p);
  c.font='900 '+Math.round(W*0.2)+'px -apple-system, sans-serif';
  c.fillStyle='#ffd166';
  c.fillText('*', 0, 0);
  c.restore();

  c.fillStyle=th.text;
  c.font='900 '+Math.round(W*0.072)+'px -apple-system, sans-serif';
  c.fillText('LEVEL '+currentLevel()+' CLEARED!', W/2, cy+cardH*0.32);
  c.fillStyle=th.dim;
  c.font='600 '+Math.round(W*0.036)+'px -apple-system, sans-serif';
  c.fillText('Score: '+score, W/2, cy+cardH*0.42);
  c.fillStyle=th.accent2;
  c.font='700 '+Math.round(W*0.034)+'px -apple-system, sans-serif';
  c.fillText('Next target: '+levelTarget(save.level+1), W/2, cy+cardH*0.48);
  var bw=cardW*0.75, bh=Math.max(56, W*0.14);
  var bx=cx+(cardW-bw)/2;
  var b1={x:bx, y:cy+cardH*0.58, w:bw, h:bh};
  drawButtonOn(c, b1, 'NEXT LEVEL', th.accent, '#ffffff', W*0.05);
  buttons.nextLevel = b1;
  var b2={x:bx, y:cy+cardH*0.58+bh+12, w:bw, h:bh};
  drawButtonOn(c, b2, 'MAIN MENU', '#555555', '#ffffff', W*0.05);
  buttons.toMenu = b2;
}

// ========== MASTER RENDER ==========
function render(){
  if (bgDirty) rebuildBackground();

  fxCtx.setTransform(DPR,0,0,DPR,0,0);
  fxCtx.clearRect(0,0,W,H);

  if (STATE === 'menu' || STATE === 'howto' || STATE === 'settings'){
    drawMenuBlocks(fxCtx);
  }

  renderFX();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  if (STATE === 'menu'){ renderMenuGameLayer(); }
  else if (STATE === 'howto'){ renderHowTo(); }
  else if (STATE === 'settings'){ renderSettings(); }
  else {
    buttons = {};
    renderHUD();
    renderBoard();
    renderGhost();
    renderTray();
    renderDrag();
    renderToast();
  }

  if (STATE === 'paused'){ buttons = {}; renderPauseOverlay(fxCtx); }
  if (STATE === 'gameover'){ buttons = {}; renderGameOverOverlay(fxCtx); }
  if (STATE === 'levelComplete'){ buttons = {}; renderLevelCompleteOverlay(fxCtx); }
}

function getPos(e){
  var rect = fxCanvasEl.getBoundingClientRect();
  return { x: e.clientX-rect.left, y: e.clientY-rect.top };
}
function inside(b, x, y){
  return b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h;
}

function triggerButtonPress(id){
  buttonPressEffects.push({ id: id, active: true, start: now });
}

function handleButton(pos){
  if (STATE==='settings'){
    if (inside(buttons.sound, pos.x, pos.y)){ save.soundOn=!save.soundOn; persist(); if (save.soundOn){ initAudio(); Sfx.click(); } vib(15); toast(save.soundOn?'Sound on':'Sound off'); return true; }
    if (inside(buttons.music, pos.x, pos.y)){ save.musicOn=!save.musicOn; persist(); if (save.musicOn){ initAudio(); startMusic(); } else { stopMusic(); } vib(15); toast(save.musicOn?'Music on':'Music off'); return true; }
    if (inside(buttons.vibration, pos.x, pos.y)){ save.vibrationOn=!save.vibrationOn; persist(); if (save.vibrationOn) vib(30); toast(save.vibrationOn?'Vibration on':'Vibration off'); return true; }
    if (inside(buttons.theme, pos.x, pos.y)){
      var keys=Object.keys(THEMES);
      var i=keys.indexOf(save.theme);
      save.theme=keys[(i+1)%keys.length];
      persist();
      bgDirty = true;
      panelCache = {};
      emptyBoardCanvas = null;
      emptyBoardKey = '';
      spriteCache = {};
      Sfx.click();
      toast('Theme: '+T().name);
      return true;
    }
    if (inside(buttons.back, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  if (STATE==='howto'){
    if (inside(buttons.back, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  if (STATE==='menu'){
    if (inside(buttons.modeClassic, pos.x, pos.y)){ triggerButtonPress('CLASSIC'); save.mode='classic'; persist(); Sfx.click(); return true; }
    if (inside(buttons.modeLevel, pos.x, pos.y)){ triggerButtonPress('LEVEL'); save.mode='level'; persist(); Sfx.click(); return true; }
    if (inside(buttons.modeRush, pos.x, pos.y)){ triggerButtonPress('RUSH'); save.mode='rush'; persist(); Sfx.click(); return true; }
    if (inside(buttons.modePuzzle, pos.x, pos.y)){ triggerButtonPress('PUZZLE'); save.mode='puzzle'; persist(); Sfx.click(); return true; }
    if (inside(buttons.settings, pos.x, pos.y)){ Sfx.click(); STATE='settings'; return true; }
    if (inside(buttons.howto, pos.x, pos.y)){ Sfx.click(); STATE='howto'; return true; }
    if (inside(buttons.play, pos.x, pos.y)){ triggerButtonPress('PLAY'); initAudio(); Sfx.click(); startGame(); return true; }
  }
  if (STATE==='paused'){
    if (inside(buttons.resume, pos.x, pos.y)){ Sfx.click(); STATE='playing'; return true; }
    if (inside(buttons.toMenu, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  if (STATE==='gameover'){
    if (inside(buttons.play, pos.x, pos.y)){ Sfx.click(); startGame(); return true; }
    if (inside(buttons.continue, pos.x, pos.y)){ Sfx.click(); toast('Loading ad...'); setTimeout(function(){ handleContinue(); }, 1200); return true; }
    if (inside(buttons.toMenu, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  if (STATE==='levelComplete'){
    if (inside(buttons.nextLevel, pos.x, pos.y)){ Sfx.click(); save.level++; persist(); startGame(); return true; }
    if (inside(buttons.toMenu, pos.x, pos.y)){ Sfx.click(); STATE='menu'; return true; }
  }
  return false;
}

// ========== DRAG UPDATE - Block Blast tilt hissi ==========
function updateDrag(pos){
  var p=drag.piece;
  var px = pos.x - drag.grabCol*cell;
  var py = pos.y - drag.grabRow*cell - LIFT;

  // Hız bazlı tilt hesabı
  var dx = px - (drag.lastPx || px);
  var dy = py - (drag.lastPy || py);
  var targetTilt = Math.max(-0.15, Math.min(0.15, dx * 0.008));
  drag.tilt = (drag.tilt || 0) * 0.7 + targetTilt * 0.3;
  drag.lastPx = px;
  drag.lastPy = py;

  drag.px = px;
  drag.py = py;
  drag.col = Math.round((px - boardX) / cell);
  drag.row = Math.round((py - boardY) / cell);
  drag.valid = canPlace(p, drag.row, drag.col);
}

function onDown(e){
  var pos=getPos(e);
  e.preventDefault();
  wakeAudio();
  initAudio();
  if (save.musicOn && !musicTimer) startMusic();
  if (handleButton(pos)) return;
  if (STATE!=='playing') return;
  if (inside(buttons.pause, pos.x, pos.y)){ Sfx.click(); vib(10); STATE='paused'; return; }
  for (var i=0;i<3;i++){
    var p=pieces[i];
    if (!p) continue;
    var x0=p.trayX-14, x1=p.trayX+p.w*p.drawCell+14;
    var y0=p.trayY-14, y1=p.trayY+p.h*p.drawCell+14;
    if (pos.x>=x0 && pos.x<=x1 && pos.y>=y0 && pos.y<=y1){
      var gc=(pos.x-p.trayX)/p.drawCell;
      var gr=(pos.y-p.trayY)/p.drawCell;
      gc=Math.max(0, Math.min(p.w, gc));
      gr=Math.max(0, Math.min(p.h, gr));
      drag={ i:i, piece:p, grabCol:gc, grabRow:gr, px:pos.x, py:pos.y, col:-99, row:-99, valid:false, pickupAt:now, startScale:0.7, lastPx:pos.x, lastPy:pos.y, tilt:0 };
      updateDrag(pos);
      Sfx.pick(); vib(8);
      return;
    }
  }
}

function onMove(e){
  if (STATE!=='playing' || !drag) return;
  e.preventDefault();
  var rect = fxCanvasEl.getBoundingClientRect();
  pendingPointer = { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function setupPuzzleBoard(){
  grid = [];
  for (var r=0;r<N;r++){ var row=[]; for (var c=0;c<N;c++) row.push(null); grid.push(row); }
  var placed = 0, attempts = 0;
  while (placed < 20 && attempts < 200){
    attempts++;
    var r2 = Math.floor(Math.random() * 5);
    var c2 = Math.floor(Math.random() * N);
    if (grid[r2][c2] === null){
      grid[r2][c2] = COLORS[(Math.random()*COLORS.length)|0];
      placed++;
    }
  }
}

function onUp(e){
  if (STATE!=='playing' || !drag) return;
  e.preventDefault();
  var d=drag;
  drag=null;
  pendingPointer = null;

  if (!d.valid) return;
  var p=d.piece;

  for (var i=0;i<p.cells.length;i++){
    var r=d.row+p.cells[i][0], c=d.col+p.cells[i][1];
    grid[r][c] = p.color;
  }
  score += p.cells.length;
  scorePulse = 1;
  pieces[d.i] = null;
  Sfx.place();
  vib(10);

  var lines = findLines();
  if (lines.rows.length || lines.cols.length){
    var cleared = {};
    for (var ri=0;ri<lines.rows.length;ri++) for (var cc=0;cc<N;cc++) cleared[lines.rows[ri]*N+cc] = true;
    for (var ci=0;ci<lines.cols.length;ci++) for (var rr=0;rr<N;rr++) cleared[rr*N+lines.cols[ci]] = true;

    for (var fri=0; fri<lines.rows.length; fri++){
      spawnFlash(boardX, boardY + lines.rows[fri]*cell, boardSize, cell, 'rgba(255,255,255,0.8)');
    }
    for (var fci=0; fci<lines.cols.length; fci++){
      spawnFlash(boardX + lines.cols[fci]*cell, boardY, cell, boardSize, 'rgba(255,255,255,0.8)');
    }

    var count = 0;
    for (var key in cleared){
      if (!cleared.hasOwnProperty(key)) continue;
      var idx = parseInt(key,10);
      var r2 = (idx/N)|0, c2 = idx%N;
      if (grid[r2][c2]!==null){
        addVanishing(boardX+c2*cell, boardY+r2*cell, grid[r2][c2]);
        spawnParticles(boardX+c2*cell, boardY+r2*cell, cell, grid[r2][c2]);
        grid[r2][c2]=null;
        count++;
      }
    }
    if (now-lastClear < 1800) combo++; else combo = 1;
    lastClear = now;
    var linesCount = lines.rows.length + lines.cols.length;
    var gain = (count*10 + (linesCount-1)*25) * Math.max(1, combo);
    score += gain;
    scorePulse = 1;
    boardGlow = 1;

    var comboText = '';
    if (combo === 2) comboText = 'NICE!';
    else if (combo === 3) comboText = 'GREAT!';
    else if (combo === 4) comboText = 'AMAZING!';
    else if (combo >= 5) comboText = 'INCREDIBLE!';

    spawnFloater(boardX+boardSize/2, boardY+boardSize/2, '+'+gain, '#ffd166', true);
    if (combo > 1) spawnFloater(boardX+boardSize/2, boardY+boardSize/2+cell*1.8, 'COMBO x'+combo, '#ff9f68', false);
    if (comboText) spawnFloater(boardX+boardSize/2, boardY+boardSize/2-cell*2.5, comboText, '#5fd3c4', true);

    if (save.mode === 'rush' && combo > 1){
      var bonusSec = Math.min(combo, 5) * RUSH_COMBO_BONUS_PER_LEVEL;
      rushTimeLeft += bonusSec * 1000;
      rushSecondsLeft = Math.max(rushSecondsLeft, Math.ceil(rushTimeLeft / 1000));
      spawnFloater(boardX+boardSize/2, boardY+boardSize/2-cell*2, '+'+bonusSec+'s', '#5fd3c4', false);
      Sfx.timeBonus();
      vib(25);
    }

    shake = Math.min(14, 7+linesCount*2.5);
    Sfx.clear(linesCount);
    if (combo > 1) Sfx.combo(combo);
    vib(linesCount>1 ? 40 : 25);
  } else {
    if (now-lastClear > 1800) combo = 0;
  }

  if (save.mode === 'puzzle'){
    puzzleMoves--;
    if (!pieces[0] && !pieces[1] && !pieces[2] && puzzleMoves > 0) newPieces();
  } else {
    if (!pieces[0] && !pieces[1] && !pieces[2]) newPieces();
  }

  var current = currentBest();
  if (score > current){ setCurrentBest(score); persist(); }
  layoutTray();

  if (save.mode === 'level' && score >= currentTarget()){
    STATE = 'levelComplete';
    spawnConfetti();
    Sfx.levelUp();
    vib([40,30,40,30,80]);
    return;
  }

  if (save.mode === 'puzzle'){
    if (puzzleMoves <= 0){
      STATE = 'gameover';
      save.totalGames++;
      persist();
      Sfx.over();
      vib([100,60,100]);
      return;
    }
    var empty = true;
    for (var rr2=0;rr2<N;rr2++){
      for (var cc2=0;cc2<N;cc2++) if (grid[rr2][cc2] !== null){ empty = false; break; }
      if (!empty) break;
    }
    if (empty){
      score += puzzleMoves * 50;
      if (score > save.bestPuzzle) save.bestPuzzle = score;
      STATE = 'gameover';
      save.totalGames++;
      persist();
      Sfx.levelUp();
      vib([40,30,40,30,120]);
      return;
    }
    if (!anyMove()){
      STATE = 'gameover';
      save.totalGames++;
      persist();
      Sfx.over();
      vib([100,60,100]);
      return;
    }
    return;
  }

  if (save.mode === 'rush'){
    if (!anyMove()){
      STATE = 'gameover';
      save.totalGames++;
      if (score > save.bestRush) save.bestRush = score;
      persist();
      Sfx.over();
      vib([100,60,100]);
    }
    return;
  }

  if (!anyMove()){
    STATE = 'gameover';
    save.totalGames++;
    persist();
    Sfx.over();
    vib([100,60,100]);
  }
}

function handleContinue(){
  var cleared = [];
  for (var c=0;c<N;c++){
    var rowsToClear = [0, N-2, N-1];
    for (var ri=0;ri<rowsToClear.length;ri++){
      var r = rowsToClear[ri];
      if (grid[r][c]!==null) cleared.push([r,c]);
    }
  }
  for (var i=0;i<8;i++){
    var rr = Math.floor(Math.random()*N);
    var cc = Math.floor(Math.random()*N);
    if (grid[rr][cc]!==null) cleared.push([rr,cc]);
  }
  for (var j=0;j<cleared.length;j++){
    var r2=cleared[j][0], c2=cleared[j][1];
    addVanishing(boardX+c2*cell, boardY+r2*cell, grid[r2][c2]);
    spawnParticles(boardX+c2*cell, boardY+r2*cell, cell, grid[r2][c2]);
    grid[r2][c2] = null;
  }
  continueUsed = true;
  newPieces();
  STATE = 'playing';
  boardGlow = 1;
  Sfx.levelUp();
  spawnFloater(W/2, H/2, 'CONTINUE!', '#5fd3c4', true);
}

fxCanvasEl.addEventListener('pointerdown', function(e){
  try { fxCanvasEl.setPointerCapture(e.pointerId); } catch(err){}
  onDown(e);
}, {passive:false});
fxCanvasEl.addEventListener('pointermove', onMove, {passive:false});
fxCanvasEl.addEventListener('pointerup', onUp, {passive:false});
fxCanvasEl.addEventListener('pointercancel', onUp, {passive:false});
fxCanvasEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('resize', function(){ setTimeout(resize, 80); });
window.addEventListener('orientationchange', function(){ setTimeout(resize, 180); });
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', function(){ setTimeout(resize, 80); });
}

function startGame(){
  score=0;
  displayScore=0;
  drag=null;
  pendingPointer=null;
  particles=[];
  floaters=[];
  vanishing=[];
  pulses=[];
  confetti=[];
  flashes=[];
  combo=0;
  lastClear=0;
  shake=0;
  scorePulse=0;
  boardGlow=0;
  continueUsed = false;
  now = performance.now();

  if (save.mode === 'puzzle'){
    setupPuzzleBoard();
    puzzleMoves = PUZZLE_MOVES;
  } else {
    grid = [];
    for (var r=0;r<N;r++){ var row=[]; for (var c=0;c<N;c++) row.push(null); grid.push(row); }
  }

  if (save.mode === 'rush'){
    rushSecondsLeft = RUSH_DURATION;
    rushTimeLeft = RUSH_DURATION * 1000;
    rushLastTick = now;
  }

  newPieces();
  resize();
  STATE = 'playing';
}

function updateRushTimer(){
  if (STATE !== 'playing') return;
  if (save.mode !== 'rush') return;
  var delta = now - rushLastTick;
  rushLastTick = now;
  rushTimeLeft -= delta;
  var newSec = Math.max(0, Math.ceil(rushTimeLeft / 1000));
  if (newSec !== rushSecondsLeft){
    rushSecondsLeft = newSec;
    if (rushSecondsLeft <= 5 && rushSecondsLeft > 0) Sfx.tick();
  }
  if (rushTimeLeft <= 0){
    STATE = 'gameover';
    save.totalGames++;
    if (score > save.bestRush) save.bestRush = score;
    persist();
    Sfx.over();
    vib([100,60,100]);
  }
}

function loop(timestamp){
  requestAnimationFrame(loop);
  try {
    now = timestamp || performance.now();

    if (pendingPointer && drag && STATE === 'playing'){
      updateDrag(pendingPointer);
      pendingPointer = null;
    }

    updateRushTimer();
    updateEffects();
    render();
  } catch(err){
    showError('LOOP HATASI: ' + err.message, err.stack || '');
  }
}

resize();
requestAnimationFrame(loop);

if (document.readyState === 'complete' || document.readyState === 'interactive'){
  setTimeout(resize, 100);
} else {
  window.addEventListener('DOMContentLoaded', function(){ setTimeout(resize, 100); });
}
window.addEventListener('load', function(){ setTimeout(resize, 200); });

})();
</script>

if (typeof navigator !== 'serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
